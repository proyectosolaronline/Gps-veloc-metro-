<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TransportSafe GPS — Tacómetro Transparente</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --v: #00e5b0;
      --v2: #00c49a;
      --rd: #ff4d6d;
      --am: #ffc107;
      --bg: #0a0f14;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ========== MAPA FULLSCREEN ========== */
    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ========== HUD ========== */
    .hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ========== TACÓMETRO CIRCULAR TRANSPARENTE ========== */
    .tacho-container {
      display: flex;
      justify-content: center;
      padding-top: 10px;
      pointer-events: auto;
    }

    .tacho-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 200px;
    }

    /* ========== ALERTAS DEBAJO DEL TACÓMETRO ========== */
    .alerts-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      pointer-events: auto;
    }

    .alert-msg {
      background: rgba(255, 77, 109, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 5px 16px;
      border-radius: 20px;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .alert-msg.show {
      display: block;
      animation: bounceIn 0.35s ease;
    }

    .alert-msg.stop {
      background: rgba(255, 193, 7, 0.55);
    }

    @keyframes bounceIn {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ========== PANEL COMUNICACIÓN LATERAL ========== */
    .comm-panel {
      position: fixed;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .comm-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .comm-btn:active {
      transform: scale(0.9);
    }

    .comm-btn.family {
      background: rgba(46, 204, 113, 0.45);
    }

    .comm-btn.empresa {
      background: rgba(52, 152, 219, 0.45);
    }

    .comm-btn.emergencia {
      background: rgba(255, 77, 109, 0.5);
      animation: sosPulse 2.2s infinite;
    }

    @keyframes sosPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.5); }
      50% { box-shadow: 0 0 0 12px rgba(255, 77, 109, 0); }
    }

    .comm-label {
      position: absolute;
      right: 50px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.55rem;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    /* ========== BOTÓN QR FLOTANTE ========== */
    .qr-float {
      position: fixed;
      bottom: 20px;
      right: 14px;
      z-index: 25;
      pointer-events: auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(142, 68, 173, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(142, 68, 173, 0.4);
      animation: floatUp 3s ease-in-out infinite;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .qr-float:active {
      transform: scale(0.9);
    }

    /* ========== MODAL QR ========== */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .qr-overlay.show {
      display: flex;
    }

    .qr-modal {
      background: rgba(26, 35, 45, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      color: #fff;
      border: 1.5px solid rgba(142, 68, 173, 0.5);
      width: 90%;
      max-width: 310px;
    }

    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      display: inline-block;
      margin: 10px 0;
    }

    .qr-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .qr-btn {
      background: rgba(142, 68, 173, 0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 7px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
    }

    /* ========== PIE DE PÁGINA ========== */
    .footer-loc {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
      padding: 0 0 7px 0;
    }

    .footer-txt {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px 55px 5px 12px;
    }

    .calle-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 14px rgba(0,0,0,0.95), 0 2px 6px rgba(0,0,0,0.8);
      text-align: center;
      line-height: 1.3;
    }

    .coord-name {
      font-size: 0.6rem;
      color: #ddd;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      margin-top: 2px;
    }

    /* ========== MODAL WHATSAPP ========== */
    .wa-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 90;
      display: none;
      flex-direction: column;
    }

    .wa-overlay.show {
      display: flex;
    }

    .wa-header {
      background: #075e54;
      color: #fff;
      padding: 11px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .wa-header button {
      background: #e74c3c;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
    }

    .wa-frame {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* ========== BOTONES SUPERIORES ========== */
    .top-btns {
      position: fixed;
      top: 8px;
      right: 8px;
      z-index: 20;
      pointer-events: auto;
      display: flex;
      gap: 4px;
    }

    .top-btn {
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.6rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .tacho-wrapper {
        width: 160px;
        height: 160px;
      }
      canvas {
        width: 160px;
        height: 160px;
      }
      .comm-btn {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .calle-name {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <!-- ========== MAPA ========== -->
  <div id="map"></div>

  <!-- ========== HUD ========== -->
  <div class="hud">
    <!-- Tacómetro Circular -->
    <div class="tacho-container">
      <div class="tacho-wrapper">
        <canvas id="tachoCanvas" width="200" height="200"></canvas>
      </div>
    </div>
    
    <!-- Alertas -->
    <div class="alerts-area">
      <div class="alert-msg" id="speedAlert">🚨 EXCESO DE VELOCIDAD</div>
      <div class="alert-msg stop" id="stopAlert">⏰ VEHÍCULO DETENIDO</div>
    </div>

    <!-- Pie de página -->
    <div class="footer-loc">
      <div class="footer-txt">
        <div class="calle-name" id="streetDisplay">Obteniendo ubicación GPS...</div>
        <div class="coord-name" id="coordDisplay"></div>
      </div>
    </div>
  </div>

  <!-- ========== PANEL COMUNICACIÓN ========== -->
  <div class="comm-panel">
    <button class="comm-btn family" id="btnFamily" title="Familia">
      👨‍👩‍👧‍👦
      <span class="comm-label">Familia</span>
    </button>
    <button class="comm-btn empresa" id="btnEmpresa" title="Empresa">
      🏢
      <span class="comm-label">Empresa</span>
    </button>
    <button class="comm-btn emergencia" id="btnEmergencia" title="Emergencia">
      🆘
      <span class="comm-label">Emergencia</span>
    </button>
  </div>

  <!-- ========== BOTÓN QR ========== -->
  <button class="qr-float" id="btnQR" title="Compartir ubicación">📱</button>

  <!-- ========== BOTONES SUPERIORES ========== -->
  <div class="top-btns">
    <button class="top-btn" id="btnUnit">km/h ⇄ mph</button>
    <button class="top-btn" id="btnCenter">📍</button>
  </div>

  <!-- ========== MODAL QR ========== -->
  <div class="qr-overlay" id="qrOverlay">
    <div class="qr-modal">
      <h3 style="font-family:'Syne',sans-serif;">📱 Escanea para ver</h3>
      <div class="qr-box" id="qrCode"></div>
      <p style="font-size:0.7rem;color:#b0bec5;" id="qrCoords"></p>
      <div class="qr-actions">
        <button class="qr-btn" id="btnShareWA">💬 WhatsApp</button>
        <button class="qr-btn" id="btnShareSMS">📱 SMS</button>
        <button class="qr-btn" id="btnCloseQR" style="background:rgba(255,77,109,0.5);">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL WHATSAPP ========== -->
  <div class="wa-overlay" id="waOverlay">
    <div class="wa-header">
      <span>💬 WhatsApp Web</span>
      <button id="btnCloseWA">✕ Cerrar</button>
    </div>
    <iframe class="wa-frame" id="waFrame"></iframe>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    (function() {
      // ============ CONFIGURACIÓN ============
      const CONFIG = {
        maxSpeed: 80,
        stopMinutes: 10,
        familiaPhone: '+521234567890',
        empresaPhone: '+521234567891',
        emergenciaPhone: '911'
      };

      // ============ ESTADO ============
      let currentSpeed = 0;
      let speedUnit = 'km/h';
      let gpsOk = false;
      let lastPosition = null;
      let pathHistory = [];
      let stopStart = null;
      let stopSent = false;
      let speedAlertActive = false;
      let maxSpeedReached = 80;

      // ============ CANVAS TACÓMETRO ============
      const canvas = document.getElementById('tachoCanvas');
      const ctx = canvas.getContext('2d');
      const W = 200, H = 200;
      const cx = W / 2, cy = H / 2;
      const radio = 88;

      function dibujarTacometro() {
        ctx.clearRect(0, 0, W, H);
        
        const dispSpeed = speedUnit === 'km/h' ? currentSpeed : currentSpeed * 0.621371;
        const limit = speedUnit === 'km/h' ? CONFIG.maxSpeed : CONFIG.maxSpeed * 0.621371;
        let escalaMax = Math.max(limit + 30, Math.ceil(maxSpeedReached * 1.2 / 10) * 10);
        if (escalaMax < limit + 20) escalaMax = limit + 30;

        const angInicio = Math.PI * 0.7;
        const angFin = Math.PI * 2.3;
        const angTotal = angFin - angInicio;

        // Fondo glass translúcido
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radio + 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10, 15, 20, 0.35)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Arco exterior glass
        ctx.beginPath();
        ctx.arc(cx, cy, radio, angInicio, angFin);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 18;
        ctx.stroke();

        // Arco de color (cambia según velocidad)
        const velFrac = Math.min(dispSpeed / escalaMax, 1.0);
        const angVel = angInicio + velFrac * angTotal;

        // Gradiente del arco
        const grad = ctx.createLinearGradient(0, 0, W, H);
        
        if (dispSpeed > limit) {
          // Rojo alerta
          grad.addColorStop(0, 'rgba(255, 77, 109, 0.8)');
          grad.addColorStop(0.5, 'rgba(255, 30, 60, 0.9)');
          grad.addColorStop(1, 'rgba(255, 77, 109, 0.8)');
        } else if (dispSpeed > limit * 0.8) {
          // Naranja precaución
          grad.addColorStop(0, 'rgba(255, 193, 7, 0.75)');
          grad.addColorStop(0.5, 'rgba(255, 160, 0, 0.85)');
          grad.addColorStop(1, 'rgba(255, 193, 7, 0.75)');
        } else {
          // Verde normal
          grad.addColorStop(0, 'rgba(0, 229, 176, 0.5)');
          grad.addColorStop(0.5, 'rgba(0, 229, 176, 0.75)');
          grad.addColorStop(1, 'rgba(0, 229, 176, 0.5)');
        }

        ctx.beginPath();
        ctx.arc(cx, cy, radio, angInicio, angVel);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 14;
        ctx.stroke();

        // Marcas del tacómetro
        ctx.save();
        ctx.translate(cx, cy);
        
        for (let i = 0; i <= 10; i++) {
          const frac = i / 10;
          const ang = angInicio + frac * angTotal;
          const val = Math.round(frac * escalaMax);
          
          const r1 = radio - 16;
          const r2 = radio + 2;
          
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
          ctx.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
          ctx.strokeStyle = val > limit ? 'rgba(255, 77, 109, 0.7)' : 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Números
          const tr = radio - 32;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.font = 'bold 9px "DM Sans"';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(val, Math.cos(ang) * tr, Math.sin(ang) * tr);
        }
        ctx.restore();

        // Aguja
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angVel);

        ctx.shadowColor = dispSpeed > limit ? 'rgba(255, 77, 109, 0.7)' : 'rgba(0, 229, 176, 0.5)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(-4, 6);
        ctx.lineTo(0, -radio + 20);
        ctx.lineTo(4, 6);
        ctx.closePath();
        ctx.fillStyle = dispSpeed > limit ? '#ff4d6d' : '#00e5b0';
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();

        // Centro
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Velocidad central (número grande)
        ctx.fillStyle = dispSpeed > limit ? '#ff4d6d' : '#fff';
        ctx.font = 'bold 42px "Syne"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 8;
        ctx.fillText(Math.round(dispSpeed), cx, cy - 8);
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = 'bold 14px "DM Sans"';
        ctx.fillText(speedUnit, cx, cy + 28);
        ctx.shadowBlur = 0;

        // Indicador límite
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.font = 'bold 8px "DM Sans"';
        ctx.fillText('MAX ' + Math.round(limit), cx, cy + 46);
      }

      // ============ MAPA ============
      const map = L.map('map', {
        zoomControl: false,
        attributionControl: false
      }).setView([19.4326, -99.1332], 16);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);

      const marker = L.circleMarker([19.4326, -99.1332], {
        radius: 8,
        fillColor: '#00e5b0',
        color: '#fff',
        weight: 3,
        fillOpacity: 1
      }).addTo(map);

      let pathLine;

      // ============ GEOLOCALIZACIÓN ============
      async function getAddress(lat, lon) {
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&accept-language=es`);
          const d = await r.json();
          if (d?.address) {
            const a = d.address;
            const parts = [];
            if (a.road || a.pedestrian) parts.push(a.road || a.pedestrian);
            if (a.suburb || a.neighbourhood) parts.push(a.suburb || a.neighbourhood);
            if (a.city || a.town || a.village) parts.push(a.city || a.town || a.village);
            document.getElementById('streetDisplay').textContent = parts.join(', ') || 'Ubicación';
          }
        } catch(e) {}
      }

      function handlePosition(pos) {
        const { latitude, longitude, speed } = pos.coords;
        gpsOk = true;
        lastPosition = { lat: latitude, lon: longitude, ts: Date.now() };
        
        pathHistory.push(lastPosition);
        if (pathHistory.length > 200) pathHistory.shift();

        if (speed !== null && speed >= 0) {
          currentSpeed = speed * 3.6;
          if (currentSpeed > maxSpeedReached) maxSpeedReached = currentSpeed;
        }

        updateUI();
        marker.setLatLng([latitude, longitude]);
        if (pathLine) pathLine.addLatLng([latitude, longitude]);
        else if (pathHistory.length > 1) {
          pathLine = L.polyline(
            pathHistory.map(p => [p.lat, p.lon]),
            { color: '#00e5b0', weight: 2, opacity: 0.4 }
          ).addTo(map);
        }
        map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
        getAddress(latitude, longitude);
        checkAlerts();
        dibujarTacometro();
      }

      function handleError() {
        gpsOk = false;
        updateUI();
        dibujarTacometro();
      }

      // ============ ALERTAS ============
      function checkAlerts() {
        const dispSpeed = speedUnit === 'km/h' ? currentSpeed : currentSpeed * 0.621371;
        const limit = speedUnit === 'km/h' ? CONFIG.maxSpeed : CONFIG.maxSpeed * 0.621371;

        if (dispSpeed > limit && !speedAlertActive) {
          speedAlertActive = true;
          document.getElementById('speedAlert').classList.add('show');
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (dispSpeed <= limit && speedAlertActive) {
          speedAlertActive = false;
          document.getElementById('speedAlert').classList.remove('show');
        }

        if (currentSpeed < 1 && gpsOk) {
          if (!stopStart) stopStart = Date.now();
          const min = Math.floor((Date.now() - stopStart) / 60000);
          if (min >= CONFIG.stopMinutes && !stopSent) {
            stopSent = true;
            document.getElementById('stopAlert').classList.add('show');
          }
        } else if (currentSpeed > 1) {
          stopStart = null;
          stopSent = false;
          document.getElementById('stopAlert').classList.remove('show');
        }
      }

      function updateUI() {
        document.getElementById('coordDisplay').textContent = lastPosition
          ? `${lastPosition.lat.toFixed(6)}, ${lastPosition.lon.toFixed(6)}`
          : '';
      }

      // ============ WHATSAPP ============
      function openWhatsApp(phone) {
        const num = phone.replace(/\+/g, '').replace(/\s/g, '');
        document.getElementById('waFrame').src = `https://web.whatsapp.com/send?phone=${num}`;
        document.getElementById('waOverlay').classList.add('show');
      }

      // ============ QR ============
      function showQR() {
        if (!lastPosition) return;
        const lat = lastPosition.lat.toFixed(6);
        const lon = lastPosition.lon.toFixed(6);
        const url = `https://www.google.com/maps?q=${lat},${lon}`;
        
        document.getElementById('qrCode').innerHTML = '';
        new QRCode(document.getElementById('qrCode'), {
          text: url, width: 170, height: 170,
          colorDark: '#1a232d', colorLight: '#ffffff'
        });
        document.getElementById('qrCoords').textContent = `${lat}, ${lon}`;
        document.getElementById('qrOverlay').classList.add('show');
      }

      // ============ EVENTOS ============
      document.getElementById('btnFamily').addEventListener('click', () => openWhatsApp(CONFIG.familiaPhone));
      document.getElementById('btnEmpresa').addEventListener('click', () => openWhatsApp(CONFIG.empresaPhone));
      document.getElementById('btnEmergencia').addEventListener('click', () => {
        if (confirm('¿Activar protocolo de emergencia?')) {
          window.open(`tel:${CONFIG.emergenciaPhone}`);
        }
      });
      document.getElementById('btnQR').addEventListener('click', showQR);
      document.getElementById('btnCloseQR').addEventListener('click', () => {
        document.getElementById('qrOverlay').classList.remove('show');
      });
      document.getElementById('btnCloseWA').addEventListener('click', () => {
        document.getElementById('waOverlay').classList.remove('show');
        document.getElementById('waFrame').src = '';
      });
      document.getElementById('btnShareWA').addEventListener('click', () => {
        if (!lastPosition) return;
        window.open(`https://wa.me/?text=${encodeURIComponent('📍 Mi ubicación: https://www.google.com/maps?q=' + lastPosition.lat + ',' + lastPosition.lon)}`);
      });
      document.getElementById('btnShareSMS').addEventListener('click', () => {
        if (!lastPosition) return;
        window.open(`sms:?body=${encodeURIComponent('📍 Mi ubicación: https://www.google.com/maps?q=' + lastPosition.lat + ',' + lastPosition.lon)}`);
      });
      document.getElementById('btnUnit').addEventListener('click', function() {
        speedUnit = speedUnit === 'km/h' ? 'mph' : 'km/h';
        this.textContent = speedUnit === 'km/h' ? 'km/h ⇄ mph' : 'mph ⇄ km/h';
        dibujarTacometro();
      });
      document.getElementById('btnCenter').addEventListener('click', () => {
        if (lastPosition) map.setView([lastPosition.lat, lastPosition.lon], 16);
      });
      document.getElementById('qrOverlay').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('show');
      });

      // ============ INICIO ============
      function startGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(handlePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 10000
        });
      }

      dibujarTacometro();
      startGPS();
    })();
  </script>
</body>
</html>
