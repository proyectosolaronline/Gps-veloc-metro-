<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Velocímetro GPS + Alertas + Monitoreo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #0a0f0d;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px;
      gap: 8px;
    }

    .top-panel {
      display: flex;
      gap: 10px;
      align-items: stretch;
      min-height: 200px;
      max-height: 280px;
    }

    .speedo-box {
      background: linear-gradient(145deg, #0d1b1f 0%, #13262b 50%, #0a1518 100%);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(52, 152, 219, 0.3);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      flex: 0 0 auto;
      width: 220px;
      position: relative;
    }

    .offline-indicator {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.65rem;
      background: rgba(231, 76, 60, 0.8);
      color: white;
      padding: 3px 8px;
      border-radius: 10px;
      display: none;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      height: auto;
    }

    .info-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .location-card {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 12px 15px;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      flex: 1;
    }

    .location-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #3498db;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .address-main {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      color: #ecf0f1;
    }

    .address-detail {
      font-size: 0.7rem;
      color: #95a5a6;
      margin-top: 4px;
      font-family: 'Courier New', monospace;
    }

    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.5);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
    }

    .gps-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
      animation: pulse 2s infinite;
    }

    .gps-led.off {
      background: #e74c3c;
      box-shadow: 0 0 8px #e74c3c;
      animation: none;
    }

    .gps-led.estimating {
      background: #f39c12;
      box-shadow: 0 0 8px #f39c12;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn {
      background: rgba(52, 152, 219, 0.15);
      border: 1px solid rgba(52, 152, 219, 0.4);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(52, 152, 219, 0.3);
    }

    .btn.active {
      background: #e74c3c;
      border-color: #e74c3c;
      animation: pulse 1s infinite;
    }

    /* Panel de alertas */
    .alerts-bar {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      border-radius: 12px;
      padding: 10px 15px;
      color: white;
      font-size: 0.8rem;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .alerts-bar.visible {
      display: block;
    }

    .alerts-bar.speed-alert {
      background: rgba(231, 76, 60, 0.2);
      border-color: #e74c3c;
    }

    .alerts-bar.stop-alert {
      background: rgba(243, 156, 18, 0.2);
      border-color: #f39c12;
    }

    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .alert-close {
      cursor: pointer;
      color: #e74c3c;
      font-size: 1.2rem;
    }

    /* Configuración */
    .config-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 25, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 2px solid #3498db;
      border-radius: 20px;
      padding: 25px;
      z-index: 2000;
      color: white;
      width: 90%;
      max-width: 400px;
      display: none;
    }

    .config-modal.show {
      display: block;
    }

    .config-modal input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
    }

    .config-modal label {
      font-size: 0.8rem;
      color: #bdc3c7;
      display: block;
      margin-top: 10px;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .map-container {
      flex: 1;
      background: #1a1f1d;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
      min-height: 300px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-click-info {
      position: absolute;
      bottom: 80px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      padding: 10px 15px;
      color: white;
      font-size: 0.8rem;
      display: none;
      border: 1px solid #3498db;
    }

    .close-info {
      float: right;
      cursor: pointer;
      color: #e74c3c;
      font-weight: bold;
    }

    /* Log de eventos */
    .event-log {
      position: absolute;
      bottom: 80px;
      right: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 8px;
      color: white;
      font-size: 0.65rem;
      max-width: 200px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .event-item {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    @media (max-width: 600px) {
      .top-panel {
        flex-direction: column;
        max-height: none;
      }
      .speedo-box {
        width: 100%;
        max-width: 220px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  
  <div class="dashboard">
    <!-- Panel Superior -->
    <div class="top-panel">
      <div class="speedo-box">
        <div class="offline-indicator" id="offlineBadge">OFFLINE</div>
        <canvas id="speedoCanvas" width="200" height="200"></canvas>
      </div>
      
      <div class="info-side">
        <!-- Alerta de velocidad -->
        <div class="alerts-bar speed-alert" id="speedAlert">
          <div class="alert-header">
            <span>🚨 ¡EXCESO DE VELOCIDAD!</span>
            <span class="alert-close" onclick="document.getElementById('speedAlert').classList.remove('visible')">✕</span>
          </div>
          <div id="speedAlertText"></div>
        </div>
        
        <!-- Alerta de detención -->
        <div class="alerts-bar stop-alert" id="stopAlert">
          <div class="alert-header">
            <span>⏰ VEHÍCULO DETENIDO</span>
            <span class="alert-close" onclick="document.getElementById('stopAlert').classList.remove('visible')">✕</span>
          </div>
          <div id="stopAlertText"></div>
        </div>
        
        <div class="location-card">
          <div class="location-title">📍 Ubicación Actual</div>
          <div class="address-main" id="addressDisplay">Obteniendo señal GPS...</div>
          <div class="address-detail" id="coordsDisplay"></div>
        </div>
        
        <div class="controls-row">
          <div class="badge">
            <span id="gpsLed" class="gps-led"></span>
            <span id="gpsStatus">Buscando</span>
          </div>
          <div class="badge">
            <span>🎯</span>
            <span id="accuracyDisplay">±0m</span>
          </div>
          <button class="btn" id="unitToggle">km/h ⇄ mph</button>
          <button class="btn" id="configBtn">⚙️ Config</button>
        </div>
      </div>
    </div>

    <!-- Mapa -->
    <div class="map-container">
      <div id="map"></div>
      
      <div class="map-click-info" id="mapClickInfo">
        <span class="close-info" id="closeMapInfo">✕</span>
        <div id="clickInfoContent"></div>
      </div>
      
      <!-- Log de eventos -->
      <div class="event-log" id="eventLog">
        <div style="font-weight:600;margin-bottom:5px;">📋 Registro</div>
        <div id="eventList">Sin eventos</div>
      </div>
    </div>
  </div>

  <!-- Modal de configuración -->
  <div class="config-modal" id="configModal">
    <h3 style="margin-bottom:15px;">⚙️ Configuración de Alertas</h3>
    
    <label>Velocidad máxima (km/h):</label>
    <input type="number" id="maxSpeedInput" value="80" min="10" max="200">
    
    <label>Email para notificaciones:</label>
    <input type="email" id="emailInput" placeholder="monitoreo@ejemplo.com">
    
    <label>Tiempo detenido para alerta (minutos):</label>
    <input type="number" id="stopTimeInput" value="10" min="1" max="60">
    
    <label>EmailJS Service ID:</label>
    <input type="text" id="serviceIdInput" placeholder="service_xxxxx">
    
    <label>EmailJS Template ID:</label>
    <input type="text" id="templateIdInput" placeholder="template_xxxxx">
    
    <label>EmailJS User ID (Public Key):</label>
    <input type="text" id="userIdInput" placeholder="user_xxxxx">
    
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn" id="saveConfig" style="flex:1;">💾 Guardar</button>
      <button class="btn" id="closeConfig" style="flex:1;background:rgba(231,76,60,0.2);">Cancelar</button>
    </div>
    
    <small style="color:#7f8c8d;display:block;margin-top:10px;">
      Configura EmailJS en <a href="https://www.emailjs.com/" target="_blank" style="color:#3498db;">emailjs.com</a>
    </small>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <script>
    (function() {
      // ============ STORAGE ============
      const Storage = {
        save(key, data) {
          try {
            localStorage.setItem(key, JSON.stringify(data));
            return true;
          } catch(e) { return false; }
        },
        load(key, fallback = null) {
          try {
            const item = localStorage.getItem(key);
            return item ? JSON.parse(item) : fallback;
          } catch(e) { return fallback; }
        }
      };

      // ============ CONFIGURACIÓN ============
      const canvas = document.getElementById('speedoCanvas');
      const ctx = canvas.getContext('2d');
      const W = 200, H = 200;
      canvas.width = W;
      canvas.height = H;
      const cx = W/2, cy = H/2;
      const radius = 88;

      // Estado
      let currentSpeed = 0;
      let maxSpeed = 80;
      let speedUnit = 'km/h';
      let gpsOk = false;
      let accuracy = 0;
      let watchId = null;
      let isOnline = navigator.onLine;
      let lastValidPosition = Storage.load('last_position', null);
      let pathHistory = Storage.load('path_history', []);
      
      // Alertas
      let maxSpeedLimit = Storage.load('max_speed_limit', 80);
      let stopTimeLimit = Storage.load('stop_time_limit', 10);
      let alertEmail = Storage.load('alert_email', '');
      let serviceId = Storage.load('service_id', '');
      let templateId = Storage.load('template_id', '');
      let userId = Storage.load('user_id', '');
      
      let speedAlertActive = false;
      let stopStartTime = null;
      let stopAlertSent = false;
      let eventLog = Storage.load('event_log', []);
      
      // Mapa
      let map, marker, pathLine;

      // Inicializar EmailJS
      if (userId) {
        emailjs.init(userId);
      }

      // ============ FUNCIONES EMAIL ============
      async function sendEmailAlert(type, data) {
        if (!serviceId || !templateId || !alertEmail) {
          console.log('Email no configurado');
          return false;
        }
        
        try {
          const templateParams = {
            to_email: alertEmail,
            alert_type: type,
            speed: data.speed || 'N/A',
            location: data.location || 'Desconocida',
            coordinates: data.coords || 'N/A',
            time: new Date().toLocaleString(),
            message: data.message || ''
          };
          
          await emailjs.send(serviceId, templateId, templateParams);
          addEvent(`📧 Email enviado: ${type}`);
          return true;
        } catch(e) {
          console.error('Error enviando email:', e);
          addEvent(`❌ Error email: ${e.message}`);
          return false;
        }
      }

      function addEvent(message) {
        eventLog.unshift({
          message,
          time: new Date().toLocaleTimeString()
        });
        if (eventLog.length > 50) eventLog.pop();
        Storage.save('event_log', eventLog);
        renderEventLog();
      }

      function renderEventLog() {
        const list = document.getElementById('eventList');
        if (eventLog.length === 0) {
          list.innerHTML = 'Sin eventos';
          return;
        }
        list.innerHTML = eventLog.slice(0, 10).map(e => 
          `<div class="event-item">${e.time} - ${e.message}</div>`
        ).join('');
      }

      // ============ ALERTAS DE VELOCIDAD ============
      function checkSpeedAlert(speed) {
        const displaySpeed = speedUnit === 'km/h' ? speed : speed * 0.621371;
        
        if (displaySpeed > maxSpeedLimit && !speedAlertActive) {
          speedAlertActive = true;
          
          const alertText = `Velocidad: ${Math.round(displaySpeed)} ${speedUnit} | Límite: ${maxSpeedLimit} ${speedUnit}`;
          document.getElementById('speedAlertText').textContent = alertText;
          document.getElementById('speedAlert').classList.add('visible');
          
          const location = document.getElementById('addressDisplay').textContent;
          const coords = lastValidPosition ? 
            `${lastValidPosition.lat.toFixed(5)}, ${lastValidPosition.lon.toFixed(5)}` : 'N/A';
          
          addEvent(`🚨 Exceso velocidad: ${Math.round(displaySpeed)} ${speedUnit}`);
          
          // Enviar email
          sendEmailAlert('EXCESO DE VELOCIDAD', {
            speed: `${Math.round(displaySpeed)} ${speedUnit}`,
            location: location,
            coords: coords,
            message: `El vehículo superó el límite de ${maxSpeedLimit} ${speedUnit}`
          });
          
          // Vibrar si está disponible
          if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
          }
          
        } else if (displaySpeed <= maxSpeedLimit && speedAlertActive) {
          speedAlertActive = false;
          document.getElementById('speedAlert').classList.remove('visible');
        }
      }

      // ============ ALERTA DE DETENCIÓN ============
      function checkStopAlert(speed) {
        const now = Date.now();
        
        if (speed < 1 && gpsOk) { // Vehículo detenido (menos de 1 km/h)
          if (!stopStartTime) {
            stopStartTime = now;
            stopAlertSent = false;
          }
          
          const stoppedMinutes = Math.floor((now - stopStartTime) / 60000);
          
          if (stoppedMinutes >= stopTimeLimit && !stopAlertSent) {
            stopAlertSent = true;
            
            const location = document.getElementById('addressDisplay').textContent;
            const coords = lastValidPosition ? 
              `${lastValidPosition.lat.toFixed(5)}, ${lastValidPosition.lon.toFixed(5)}` : 'N/A';
            
            document.getElementById('stopAlertText').textContent = 
              `Detenido por ${stoppedMinutes} minutos | ${location}`;
            document.getElementById('stopAlert').classList.add('visible');
            
            addEvent(`⏰ Detención ${stoppedMinutes}min`);
            
            // Enviar email
            sendEmailAlert('VEHÍCULO DETENIDO', {
              speed: '0 km/h',
              location: location,
              coords: coords,
              message: `El vehículo lleva detenido más de ${stopTimeLimit} minutos`
            });
            
            if (navigator.vibrate) {
              navigator.vibrate(1000);
            }
          }
        } else {
          // Reiniciar si se mueve
          if (stopStartTime && speed > 1) {
            stopStartTime = null;
            stopAlertSent = false;
            document.getElementById('stopAlert').classList.remove('visible');
          }
        }
      }

      // ============ DIBUJO ============
      function drawGauge() {
        ctx.clearRect(0, 0, W, H);
        const dispSpeed = speedUnit === 'km/h' ? currentSpeed : currentSpeed * 0.621371;
        let scaleMax = Math.max(maxSpeedLimit + 20, Math.ceil(maxSpeed * 1.2 / 10) * 10);
        if (scaleMax < maxSpeedLimit + 10) scaleMax = maxSpeedLimit + 20;
        
        const startA = Math.PI * 0.7;
        const endA = Math.PI * 2.3;
        const totalA = endA - startA;
        
        // Arco fondo
        ctx.beginPath();
        ctx.arc(cx, cy, radius, startA, endA);
        ctx.strokeStyle = '#1a2a30';
        ctx.lineWidth = 16;
        ctx.stroke();
        
        // Zona de peligro (roja)
        const dangerStart = startA + (maxSpeedLimit / scaleMax) * totalA;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, dangerStart, endA);
        ctx.strokeStyle = 'rgba(231, 76, 60, 0.3)';
        ctx.lineWidth = 12;
        ctx.stroke();
        
        // Arco normal
        ctx.beginPath();
        ctx.arc(cx, cy, radius, startA, dangerStart);
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#0d4f6b');
        grad.addColorStop(0.5, '#1a6d8a');
        grad.addColorStop(1, '#0d4f6b');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 12;
        ctx.stroke();
        
        // Marcas
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#bdc3c7';
        ctx.font = 'bold 10px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        for (let i = 0; i <= 10; i++) {
          const frac = i / 10;
          const ang = startA + frac * totalA;
          const val = Math.round(frac * scaleMax);
          
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * (radius - 14), Math.sin(ang) * (radius - 14));
          ctx.lineTo(Math.cos(ang) * (radius + 2), Math.sin(ang) * (radius + 2));
          ctx.strokeStyle = val > maxSpeedLimit ? '#e74c3c' : '#95a5a6';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          
          ctx.fillText(val, Math.cos(ang) * (radius - 28), Math.sin(ang) * (radius - 28));
        }
        ctx.restore();
        
        // Aguja
        const speedFrac = Math.min(dispSpeed / scaleMax, 1.0);
        const needleAng = startA + speedFrac * totalA;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(needleAng);
        
        ctx.shadowColor = dispSpeed > maxSpeedLimit ? 'rgba(231, 76, 60, 0.8)' : 'rgba(52, 152, 219, 0.8)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(-5, 6);
        ctx.lineTo(0, -radius + 18);
        ctx.lineTo(5, 6);
        ctx.closePath();
        ctx.fillStyle = dispSpeed > maxSpeedLimit ? '#e74c3c' : '#3498db';
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, 2*Math.PI);
        ctx.fillStyle = '#2c3e50';
        ctx.fill();
        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        
        // Velocidad central
        ctx.fillStyle = dispSpeed > maxSpeedLimit ? '#e74c3c' : '#ffffff';
        ctx.font = 'bold 48px "Segoe UI"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00000080';
        ctx.shadowBlur = 15;
        ctx.fillText(Math.round(dispSpeed).toString(), cx, cy - 12);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#bdc3c7';
        ctx.font = 'bold 18px "Segoe UI"';
        ctx.fillText(speedUnit, cx, cy + 35);
        
        // Límite
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 10px "Segoe UI"';
        ctx.fillText(`MAX ${maxSpeedLimit}`, cx, cy + 52);
      }

      // ============ GPS ============
      function handlePosition(pos) {
        const { latitude, longitude, speed, accuracy: acc } = pos.coords;
        
        gpsOk = true;
        accuracy = acc;
        
        lastValidPosition = { lat: latitude, lon: longitude, timestamp: Date.now() };
        Storage.save('last_position', lastValidPosition);
        
        pathHistory.push(lastValidPosition);
        if (pathHistory.length > 100) pathHistory.shift();
        Storage.save('path_history', pathHistory);
        
        if (speed !== null && speed >= 0) {
          currentSpeed = speed * 3.6;
        }
        
        if (currentSpeed > maxSpeed) {
          maxSpeed = currentSpeed;
        }
        
        updateUI();
        updateMap(latitude, longitude);
        getAddress(latitude, longitude);
        checkSpeedAlert(currentSpeed);
        checkStopAlert(currentSpeed);
      }

      function handleError(err) {
        gpsOk = false;
        updateUI();
      }

      function updateUI() {
        document.getElementById('gpsLed').className = gpsOk ? 'gps-led' : 'gps-led off';
        document.getElementById('gpsStatus').textContent = gpsOk ? 'GPS Activo' : 'Sin señal';
        document.getElementById('accuracyDisplay').textContent = `±${Math.round(accuracy)}m`;
        
        if (lastValidPosition) {
          document.getElementById('coordsDisplay').textContent = 
            `${lastValidPosition.lat.toFixed(6)}, ${lastValidPosition.lon.toFixed(6)}`;
        }
        
        drawGauge();
      }

      async function getAddress(lat, lon) {
        try {
          const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&accept-language=es`;
          const resp = await fetch(url);
          const data = await resp.json();
          
          if (data && data.address) {
            const a = data.address;
            const parts = [];
            if (a.road) parts.push(a.road);
            if (a.city || a.town) parts.push(a.city || a.town);
            if (a.state) parts.push(a.state);
            document.getElementById('addressDisplay').textContent = parts.join(', ') || 'Ubicación';
          }
        } catch(e) {
          document.getElementById('addressDisplay').textContent = 'Sin datos';
        }
      }

      // ============ MAPA ============
      function initMap() {
        const start = lastValidPosition || { lat: 19.4326, lon: -99.1332 };
        
        map = L.map('map', { zoomControl: true }).setView([start.lat, start.lon], 16);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);
        
        marker = L.marker([start.lat, start.lon]).addTo(map);
        
        if (pathHistory.length > 0) {
          pathLine = L.polyline(
            pathHistory.map(p => [p.lat, p.lon]),
            { color: '#3498db', weight: 4 }
          ).addTo(map);
        }
        
        map.on('click', async function(e) {
          const { lat, lng } = e.latlng;
          const info = document.getElementById('clickInfoContent');
          info.innerHTML = `
            <strong>📍 Coordenadas:</strong><br>
            Lat: ${lat.toFixed(6)}<br>
            Lon: ${lng.toFixed(6)}
          `;
          document.getElementById('mapClickInfo').style.display = 'block';
          navigator.clipboard?.writeText(`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        });
        
        document.getElementById('closeMapInfo').addEventListener('click', () => {
          document.getElementById('mapClickInfo').style.display = 'none';
        });
      }

      function updateMap(lat, lon) {
        if (!map) return;
        marker.setLatLng([lat, lon]);
        if (pathLine) pathLine.addLatLng([lat, lon]);
        map.setView([lat, lon], map.getZoom());
      }

      // ============ CONFIGURACIÓN ============
      function openConfig() {
        document.getElementById('maxSpeedInput').value = maxSpeedLimit;
        document.getElementById('emailInput').value = alertEmail;
        document.getElementById('stopTimeInput').value = stopTimeLimit;
        document.getElementById('serviceIdInput').value = serviceId;
        document.getElementById('templateIdInput').value = templateId;
        document.getElementById('userIdInput').value = userId;
        
        document.getElementById('configModal').classList.add('show');
        document.getElementById('overlay').classList.add('show');
      }

      function closeConfig() {
        document.getElementById('configModal').classList.remove('show');
        document.getElementById('overlay').classList.remove('show');
      }

      function saveConfig() {
        maxSpeedLimit = parseInt(document.getElementById('maxSpeedInput').value) || 80;
        alertEmail = document.getElementById('emailInput').value;
        stopTimeLimit = parseInt(document.getElementById('stopTimeInput').value) || 10;
        serviceId = document.getElementById('serviceIdInput').value;
        templateId = document.getElementById('templateIdInput').value;
        userId = document.getElementById('userIdInput').value;
        
        Storage.save('max_speed_limit', maxSpeedLimit);
        Storage.save('alert_email', alertEmail);
        Storage.save('stop_time_limit', stopTimeLimit);
        Storage.save('service_id', serviceId);
        Storage.save('template_id', templateId);
        Storage.save('user_id', userId);
        
        if (userId) emailjs.init(userId);
        
        closeConfig();
        drawGauge();
        addEvent('⚙️ Configuración actualizada');
      }

      // ============ EVENTOS ============
      document.getElementById('unitToggle').addEventListener('click', function() {
        speedUnit = speedUnit === 'km/h' ? 'mph' : 'km/h';
        this.textContent = speedUnit === 'km/h' ? 'km/h ⇄ mph' : 'mph ⇄ km/h';
        drawGauge();
      });

      document.getElementById('configBtn').addEventListener('click', openConfig);
      document.getElementById('closeConfig').addEventListener('click', closeConfig);
      document.getElementById('overlay').addEventListener('click', closeConfig);
      document.getElementById('saveConfig').addEventListener('click', saveConfig);

      window.addEventListener('online', () => {
        isOnline = true;
        document.getElementById('offlineBadge').style.display = 'none';
      });
      
      window.addEventListener('offline', () => {
        isOnline = false;
        document.getElementById('offlineBadge').style.display = 'block';
      });

      // ============ INICIO ============
      function startGPS() {
        if (!navigator.geolocation) return;
        
        navigator.geolocation.watchPosition(
          handlePosition,
          handleError,
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
        );
      }

      function init() {
        initMap();
        drawGauge();
        updateUI();
        renderEventLog();
        startGPS();
        
        // Verificar estado de detención cada 30 segundos
        setInterval(() => {
          checkStopAlert(currentSpeed);
        }, 30000);
      }

      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
