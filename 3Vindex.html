<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPS Fullscreen - Velocímetro Digital + Mapa</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background: #000;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* MAPA OCUPA TODO */
    .fullscreen-map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* CAPA SUPERIOR: Velocímetro digital + alertas */
    .hud-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Velocímetro digital centrado arriba */
    .speed-digital-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      pointer-events: auto;
    }

    .speed-panel {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 15px 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      min-width: 180px;
    }

    .speed-number {
      font-size: 5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 
        0 0 30px rgba(52, 152, 219, 0.6),
        0 0 60px rgba(52, 152, 219, 0.3);
      line-height: 1;
      letter-spacing: -2px;
      transition: color 0.3s;
    }

    .speed-number.warning {
      color: #f39c12;
      text-shadow: 
        0 0 30px rgba(243, 156, 18, 0.8),
        0 0 60px rgba(243, 156, 18, 0.4);
    }

    .speed-number.danger {
      color: #e74c3c;
      text-shadow: 
        0 0 30px rgba(231, 76, 60, 0.9),
        0 0 60px rgba(231, 76, 60, 0.5);
      animation: pulse-danger 0.8s infinite;
    }

    @keyframes pulse-danger {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .speed-unit {
      font-size: 1.2rem;
      font-weight: 600;
      color: #bdc3c7;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 2px;
    }

    .speed-gps-status {
      font-size: 0.6rem;
      color: #2ecc71;
      letter-spacing: 1px;
      margin-top: 4px;
      font-weight: 600;
    }

    .speed-gps-status.offline {
      color: #e74c3c;
    }

    /* Alertas debajo del velocímetro */
    .alerts-stack {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
      pointer-events: auto;
      max-width: 350px;
      width: 90%;
    }

    .alert-banner {
      background: rgba(231, 76, 60, 0.85);
      backdrop-filter: blur(10px);
      padding: 8px 15px;
      border-radius: 12px;
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      animation: slideDown 0.3s ease;
      display: none;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .alert-banner.visible {
      display: block;
    }

    .alert-banner.stop-alert {
      background: rgba(243, 156, 18, 0.85);
    }

    @keyframes slideDown {
      from { transform: translateY(-15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Pie de página DENTRO DEL MAPA */
    .map-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      pointer-events: none;
      padding: 0 0 10px 0;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 15px;
    }

    .transit-location {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 
        0 0 12px rgba(0,0,0,0.95),
        0 0 25px rgba(0,0,0,0.8),
        0 2px 5px rgba(0,0,0,0.9),
        -1px -1px 0 rgba(0,0,0,0.6),
        1px -1px 0 rgba(0,0,0,0.6),
        -1px 1px 0 rgba(0,0,0,0.6),
        1px 1px 0 rgba(0,0,0,0.6);
      text-align: center;
      letter-spacing: 0.4px;
      line-height: 1.3;
      max-width: 90%;
    }

    .transit-coords {
      font-size: 0.68rem;
      font-weight: 500;
      color: #ecf0f1;
      text-shadow: 
        0 0 8px rgba(0,0,0,0.9),
        0 2px 4px rgba(0,0,0,0.7);
      font-family: 'Courier New', monospace;
      margin-top: 3px;
      letter-spacing: 0.3px;
    }

    /* Botones de alerta flotantes */
    .floating-report-btns {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .report-btn-small {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 5px 10px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.6rem;
      font-weight: 600;
      transition: 0.2s;
      text-shadow: 0 1px 3px black;
    }

    .report-btn-small:hover {
      background: rgba(231, 76, 60, 0.6);
    }

    .report-btn-small:active {
      transform: scale(0.9);
    }

    /* Botón configuración */
    .config-btn-float {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      pointer-events: auto;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal configuración */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #1a1f2e;
      border: 2px solid #3498db;
      border-radius: 20px;
      padding: 20px;
      width: 90%;
      max-width: 350px;
      color: white;
      pointer-events: auto;
    }

    .modal-box h3 {
      color: #3498db;
      margin-bottom: 12px;
    }

    .modal-box label {
      font-size: 0.7rem;
      color: #95a5a6;
      display: block;
      margin-top: 8px;
    }

    .modal-box input {
      width: 100%;
      padding: 8px;
      margin-top: 3px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 0.85rem;
    }

    .modal-box button {
      margin-top: 12px;
      padding: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      border: none;
      width: 100%;
      font-size: 0.85rem;
    }

    .btn-save {
      background: #3498db;
      color: white;
    }

    .btn-close {
      background: rgba(231,76,60,0.3);
      color: white;
      margin-top: 5px;
    }

    /* Info clic mapa */
    .map-tap-info {
      position: fixed;
      bottom: 80px;
      left: 10px;
      right: 10px;
      z-index: 15;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px);
      border-radius: 12px;
      padding: 12px;
      color: white;
      font-size: 0.8rem;
      display: none;
      pointer-events: auto;
      border: 1px solid #3498db;
    }

    .map-tap-info .close-tap {
      float: right;
      cursor: pointer;
      color: #e74c3c;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .speed-number {
        font-size: 3.5rem;
      }
      .speed-panel {
        padding: 10px 20px;
      }
      .transit-location {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- MAPA FULLSCREEN -->
  <div class="fullscreen-map">
    <div id="map"></div>
  </div>

  <!-- HUD: Velocímetro + Alertas + Pie de página -->
  <div class="hud-overlay">
    <!-- Velocímetro digital -->
    <div class="speed-digital-container">
      <div class="speed-panel">
        <div class="speed-number" id="speedDisplay">0</div>
        <div class="speed-unit" id="unitDisplay">km/h</div>
        <div class="speed-gps-status" id="gpsMiniStatus">● GPS ACTIVO</div>
      </div>
      
      <!-- Alertas debajo del velocímetro -->
      <div class="alerts-stack">
        <div class="alert-banner" id="speedAlertBanner">
          🚨 ¡EXCESO DE VELOCIDAD! <span id="speedAlertValue"></span>
        </div>
        <div class="alert-banner stop-alert" id="stopAlertBanner">
          ⏰ VEHÍCULO DETENIDO <span id="stopAlertTime"></span>
        </div>
      </div>
    </div>

    <!-- Pie de página con localidad -->
    <div class="map-footer">
      <div class="footer-content">
        <div class="transit-location" id="transitLocation">Obteniendo ubicación GPS...</div>
        <div class="transit-coords" id="transitCoords"></div>
      </div>
    </div>
  </div>

  <!-- Botones de reporte -->
  <div class="floating-report-btns">
    <button class="report-btn-small" data-type="accidente">🚗 Accidente</button>
    <button class="report-btn-small" data-type="obra">🚧 Obra</button>
    <button class="report-btn-small" data-type="policia">👮 Policía</button>
    <button class="report-btn-small" data-type="trafico">🚦 Tráfico</button>
  </div>

  <!-- Botón configuración -->
  <button class="config-btn-float" id="configBtn">⚙️</button>

  <!-- Info al tocar mapa -->
  <div class="map-tap-info" id="mapTapInfo">
    <span class="close-tap" id="closeTapInfo">✕</span>
    <div id="tapInfoContent"></div>
  </div>

  <!-- Modal Configuración -->
  <div class="modal-overlay" id="configModal">
    <div class="modal-box">
      <h3>⚙️ Configuración</h3>
      <label>Velocidad máxima (km/h)</label>
      <input type="number" id="maxSpeedCfg" value="80" min="10">
      <label>Alerta detención (minutos)</label>
      <input type="number" id="stopTimeCfg" value="10" min="1">
      <label>Email alertas</label>
      <input type="email" id="emailCfg" placeholder="opcional@email.com">
      <button class="btn-save" id="saveCfgBtn">💾 Guardar</button>
      <button class="btn-close" id="closeCfgBtn">Cancelar</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
    (function() {
      // ============ STORAGE ============
      const store = {
        get(k, d=null) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch(e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
      };

      // ============ ESTADO ============
      let currentSpeed = 0;
      let maxSpeedLimit = store.get('maxSpeedLimit', 80);
      let stopTimeLimit = store.get('stopTimeLimit', 10);
      let speedUnit = 'km/h';
      let gpsOk = false;
      let isOnline = navigator.onLine;
      let lastPosition = store.get('lastPos', null);
      let pathHistory = store.get('pathHistory', []);
      let stopStartTime = null;
      let stopAlertSent = false;
      let speedAlertActive = false;
      let alertEmail = store.get('alertEmail', '');

      // ============ MAPA ============
      let map, marker, pathLine;

      function initMap() {
        const start = lastPosition || { lat: 19.4326, lon: -99.1332 };
        map = L.map('map', {
          zoomControl: false,
          attributionControl: false
        }).setView([start.lat, start.lon], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);

        // Marcador personalizado (punto azul)
        marker = L.circleMarker([start.lat, start.lon], {
          radius: 8,
          fillColor: '#3498db',
          color: '#fff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map);

        // Ruta histórica
        if (pathHistory.length > 1) {
          pathLine = L.polyline(
            pathHistory.map(p => [p.lat, p.lon]),
            { color: '#3498db', weight: 3, opacity: 0.6 }
          ).addTo(map);
        }

        // Clic en mapa = info
        map.on('click', async (e) => {
          const { lat, lng } = e.latlng;
          document.getElementById('tapInfoContent').innerHTML = `
            <strong>📍 Lat:</strong> ${lat.toFixed(6)}<br>
            <strong>📍 Lon:</strong> ${lng.toFixed(6)}<br>
            <small style="color:#7f8c8d;">Copiado al portapapeles</small>
          `;
          document.getElementById('mapTapInfo').style.display = 'block';
          navigator.clipboard?.writeText(`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        });

        document.getElementById('closeTapInfo').addEventListener('click', () => {
          document.getElementById('mapTapInfo').style.display = 'none';
        });
      }

      function updateMap(lat, lon) {
        if (!map) return;
        marker.setLatLng([lat, lon]);
        if (pathLine) pathLine.addLatLng([lat, lon]);
        map.panTo([lat, lon], { animate: true, duration: 0.5 });
      }

      // ============ GEOLOCALIZACIÓN INVERSA ============
      async function getTransitLocation(lat, lon) {
        const cached = store.get('cachedAddress', null);
        
        try {
          if (!navigator.onLine && cached) {
            showLocation(cached, true);
            return;
          }

          const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=es`;
          const resp = await fetch(url, {
            headers: { 'User-Agent': 'GPS-Tracker/3.0' }
          });
          const data = await resp.json();

          let address = '';
          if (data?.address) {
            const a = data.address;
            const parts = [];
            if (a.road || a.pedestrian) parts.push(a.road || a.pedestrian);
            if (a.suburb || a.neighbourhood) parts.push(a.suburb || a.neighbourhood);
            if (a.city || a.town || a.village) parts.push(a.city || a.town || a.village);
            if (a.state) parts.push(a.state);
            address = parts.join(', ') || data.display_name || 'Ubicación desconocida';
          }

          store.set('cachedAddress', address);
          showLocation(address, false);

        } catch(e) {
          if (cached) showLocation(cached, true);
        }
      }

      function showLocation(address, isCached) {
        const prefix = isCached ? '📦 ' : '';
        document.getElementById('transitLocation').textContent = prefix + address;
        document.getElementById('transitCoords').textContent = lastPosition
          ? `${lastPosition.lat.toFixed(6)}, ${lastPosition.lon.toFixed(6)}`
          : '';
      }

      // ============ GPS ============
      function handlePosition(pos) {
        const { latitude, longitude, speed, accuracy } = pos.coords;
        
        gpsOk = true;
        lastPosition = { lat: latitude, lon: longitude, timestamp: Date.now() };
        store.set('lastPos', lastPosition);

        pathHistory.push(lastPosition);
        if (pathHistory.length > 200) pathHistory.shift();
        store.set('pathHistory', pathHistory);

        if (speed !== null && speed >= 0) {
          currentSpeed = speed * 3.6;
          store.set('lastSpeed', currentSpeed);
        } else if (pathHistory.length >= 2) {
          currentSpeed = estimateSpeed();
        }

        updateUI();
        updateMap(latitude, longitude);
        getTransitLocation(latitude, longitude);
        checkAlerts();
      }

      function handleError(err) {
        gpsOk = false;
        updateUI();
        
        if (lastPosition && pathHistory.length >= 2) {
          currentSpeed = estimateSpeed();
          updateUI();
        }
      }

      function estimateSpeed() {
        if (pathHistory.length < 2) return 0;
        const a = pathHistory[pathHistory.length - 2];
        const b = pathHistory[pathHistory.length - 1];
        const dt = (b.timestamp - a.timestamp) / 1000;
        if (dt <= 0 || dt > 30) return 0;

        const R = 6371000;
        const dLat = (b.lat - a.lat) * Math.PI / 180;
        const dLon = (b.lon - a.lon) * Math.PI / 180;
        const lat1 = a.lat * Math.PI / 180;
        const lat2 = b.lat * Math.PI / 180;
        const aa = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
        const dist = R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
        return Math.min((dist / dt) * 3.6, 200);
      }

      // ============ ALERTAS ============
      function checkAlerts() {
        const displaySpeed = speedUnit === 'km/h' ? currentSpeed : currentSpeed * 0.621371;
        const limit = speedUnit === 'km/h' ? maxSpeedLimit : maxSpeedLimit * 0.621371;

        // Alerta velocidad
        if (displaySpeed > limit && !speedAlertActive) {
          speedAlertActive = true;
          const banner = document.getElementById('speedAlertBanner');
          document.getElementById('speedAlertValue').textContent = 
            `${Math.round(displaySpeed)} ${speedUnit} (límite: ${Math.round(limit)})`;
          banner.classList.add('visible');
          
          document.getElementById('speedDisplay').classList.add('danger');
          
          if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
          
          store.set('lastAlert', {
            type: 'speed',
            speed: Math.round(displaySpeed),
            time: new Date().toISOString(),
            location: document.getElementById('transitLocation').textContent
          });

        } else if (displaySpeed <= limit && speedAlertActive) {
          speedAlertActive = false;
          document.getElementById('speedAlertBanner').classList.remove('visible');
          document.getElementById('speedDisplay').classList.remove('danger');
        }

        // Alerta detención
        const now = Date.now();
        if (currentSpeed < 1 && gpsOk) {
          if (!stopStartTime) stopStartTime = now;
          const stoppedMin = Math.floor((now - stopStartTime) / 60000);
          
          if (stoppedMin >= stopTimeLimit && !stopAlertSent) {
            stopAlertSent = true;
            const banner = document.getElementById('stopAlertBanner');
            document.getElementById('stopAlertTime').textContent = `${stoppedMin} minutos`;
            banner.classList.add('visible');
            
            if (navigator.vibrate) navigator.vibrate(1000);
            
            store.set('lastStopAlert', {
              duration: stoppedMin,
              time: new Date().toISOString(),
              location: document.getElementById('transitLocation').textContent
            });
          }
        } else if (currentSpeed > 1) {
          stopStartTime = null;
          stopAlertSent = false;
          document.getElementById('stopAlertBanner').classList.remove('visible');
        }
      }

      // ============ UI ============
      function updateUI() {
        const displaySpeed = speedUnit === 'km/h' ? currentSpeed : currentSpeed * 0.621371;
        const speedEl = document.getElementById('speedDisplay');
        
        speedEl.textContent = Math.round(displaySpeed);
        
        // Color según velocidad
        const limit = speedUnit === 'km/h' ? maxSpeedLimit : maxSpeedLimit * 0.621371;
        speedEl.classList.remove('warning', 'danger');
        if (displaySpeed > limit * 0.85 && displaySpeed <= limit) {
          speedEl.classList.add('warning');
        } else if (displaySpeed > limit) {
          speedEl.classList.add('danger');
        }

        document.getElementById('unitDisplay').textContent = speedUnit;
        
        const statusEl = document.getElementById('gpsMiniStatus');
        if (gpsOk && isOnline) {
          statusEl.textContent = '● GPS ACTIVO';
          statusEl.className = 'speed-gps-status';
        } else if (gpsOk && !isOnline) {
          statusEl.textContent = '● GPS (OFFLINE)';
          statusEl.className = 'speed-gps-status offline';
        } else {
          statusEl.textContent = '● SIN SEÑAL';
          statusEl.className = 'speed-gps-status offline';
        }
      }

      // ============ CONFIGURACIÓN ============
      document.getElementById('configBtn').addEventListener('click', () => {
        document.getElementById('maxSpeedCfg').value = maxSpeedLimit;
        document.getElementById('stopTimeCfg').value = stopTimeLimit;
        document.getElementById('emailCfg').value = alertEmail;
        document.getElementById('configModal').classList.add('show');
      });

      document.getElementById('closeCfgBtn').addEventListener('click', () => {
        document.getElementById('configModal').classList.remove('show');
      });

      document.getElementById('saveCfgBtn').addEventListener('click', () => {
        maxSpeedLimit = parseInt(document.getElementById('maxSpeedCfg').value) || 80;
        stopTimeLimit = parseInt(document.getElementById('stopTimeCfg').value) || 10;
        alertEmail = document.getElementById('emailCfg').value;
        
        store.set('maxSpeedLimit', maxSpeedLimit);
        store.set('stopTimeLimit', stopTimeLimit);
        store.set('alertEmail', alertEmail);
        
        document.getElementById('configModal').classList.remove('show');
        updateUI();
      });

      // ============ REPORTES ============
      document.querySelectorAll('.report-btn-small').forEach(btn => {
        btn.addEventListener('click', function() {
          if (!lastPosition) return;
          const type = this.dataset.type;
          const alerts = store.get('userAlerts', []);
          alerts.push({
            type,
            lat: lastPosition.lat,
            lon: lastPosition.lon,
            time: Date.now()
          });
          if (alerts.length > 50) alerts.shift();
          store.set('userAlerts', alerts);
          
          // Feedback visual
          this.style.transform = 'scale(1.3)';
          setTimeout(() => { this.style.transform = 'scale(1)'; }, 200);
        });
      });

      // ============ INICIO ============
      function startGPS() {
        if (!navigator.geolocation) return;
        navigator.geolocation.watchPosition(
          handlePosition,
          handleError,
          { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
      }

      function init() {
        initMap();
        updateUI();
        startGPS();

        // Cargar última ubicación
        if (lastPosition) {
          getTransitLocation(lastPosition.lat, lastPosition.lon);
        }

        // Monitorear conexión
        window.addEventListener('online', () => {
          isOnline = true;
          updateUI();
        });
        window.addEventListener('offline', () => {
          isOnline = false;
          updateUI();
        });
      }

      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
